<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:24px 14px 38px;background:#fcfaf7;color:#232e3a;font-family:Arial,sans-serif}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;max-width:900px;margin:auto}
.card{padding:0;text-align:left;cursor:pointer;border:1px solid #e5dcd5;border-radius:24px;overflow:hidden;background:#fff;color:inherit;box-shadow:0 12px 32px #2330440d;transition:transform .35s,box-shadow .35s,border-color .35s;animation:arrive .6s both}
.card:nth-child(2){animation-delay:.12s}.photo{height:300px;overflow:hidden;background:linear-gradient(140deg,#f0d4c6,#d4e1df);display:grid;place-items:center;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%;transition:transform .6s}
.initials{font-size:84px;letter-spacing:-7px;color:#755448;font-weight:700}.badge{position:absolute;bottom:16px;left:18px;background:#ffffffed;color:#70534b;border-radius:30px;padding:8px 13px;font-size:11px;letter-spacing:1.5px}
.info{padding:24px}.info h2{margin:0 0 9px;font-size:23px}.info p{margin:0;color:#657178;font-size:14px}.action{margin-top:22px;display:flex;justify-content:space-between;font-size:13px;color:#b8554b}.arrow{transition:transform .3s}
@media(hover:hover){.card:hover{transform:translateY(-8px);box-shadow:0 24px 48px #23304421;border-color:#d4685d}.card:hover img{transform:scale(1.065)}.card:hover .arrow{transform:translateX(5px)}}
.card:focus-visible,.close:focus-visible,a:focus-visible{outline:3px solid #b8554b;outline-offset:4px}
dialog{width:min(460px,calc(100% - 28px));border:1px solid #e9d9d0;border-radius:26px;padding:32px;background:#fffdfb;color:#232e3a;box-shadow:0 32px 90px #19293955;max-height:90vh;overflow:auto}
dialog[open]{animation:popup .35s cubic-bezier(.2,.8,.2,1)}dialog::backdrop{background:#1e2c3d88;backdrop-filter:blur(5px);animation:fade .25s}
.close{position:absolute;right:14px;top:12px;border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;background:#f0e9e3;font-size:23px;color:#544b46}
.avatar{height:100px;width:100px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#edd6c9;margin-bottom:22px}.avatar img{height:100%;width:100%;object-fit:cover;object-position:center 25%}.avatar .initials{font-size:36px;letter-spacing:-2px}
dialog h2{font-size:27px;line-height:1.2;margin:0 0 10px}.tag{display:inline-block;background:#f4e4db;color:#9b5546;padding:6px 12px;border-radius:20px;font-size:13px;margin:0 0 22px}
dl{margin:0}dt{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#8b7770;margin:17px 0 6px}dd{margin:0;font-size:16px;line-height:1.6;overflow-wrap:anywhere}a{color:#ac5144;text-decoration:none}a:hover{text-decoration:underline}
@keyframes arrive{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}@keyframes popup{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:560px){body{padding:12px 8px}.grid{grid-template-columns:1fr;gap:18px}.photo{height:230px}.info{padding:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Full-width photographic author profiles. */
body{padding:12px;background:#fcfaf7}
.grid{width:100%;max-width:none;gap:24px;min-height:calc(100vh - 32px)}
.card{position:relative;min-height:740px;border:0;border-radius:24px;background:#24343d;isolation:isolate}
.photo{position:absolute;inset:0;height:100%;background:linear-gradient(145deg,#536c70,#322c35)}
.photo img{object-position:center 20%}
.photo>.initials{font-size:clamp(100px,12vw,200px);color:#e8d8cc;align-self:start;margin-top:160px}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,#101d2b55 55%,#101d2bf5 100%)}
.badge{top:26px;bottom:auto;left:26px;z-index:1;background:#ffffffde}
.info{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:clamp(26px,4vw,56px);color:#fff}
.info h2{font-size:clamp(28px,3.4vw,54px);line-height:1.05;max-width:520px;margin-bottom:16px}
.info p{color:#e2e6e8;font-size:16px;line-height:1.5}.action{color:#f6c8b5;font-size:16px;margin-top:32px}
dialog{position:fixed;inset:12px;margin:auto;width:calc(100% - 24px);max-width:none;height:calc(100% - 24px);max-height:none;padding:0;border:0;border-radius:24px;background:#263840;color:#fff;overflow:auto;isolation:isolate}
.avatar{position:absolute;inset:0;width:100%;height:100%;min-height:740px;border-radius:0;margin:0;background:linear-gradient(135deg,#263e46,#70534b);z-index:-2}
.avatar img{object-position:center 20%;width:100%;height:100%;object-fit:cover}
.avatar .initials{font-size:clamp(160px,30vw,400px);letter-spacing:-12px;color:#ffffff30;justify-self:end;margin-right:8%}
dialog::after{content:"";position:absolute;inset:0;min-height:740px;background:linear-gradient(90deg,#101c2bf2 0%,#101c2bc9 37%,#101c2b30 75%);z-index:-1}
.profile-copy{position:relative;padding:clamp(32px,6vw,88px);max-width:680px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
dialog h2{font-size:clamp(36px,5vw,76px);line-height:1.03;margin:0 0 20px;letter-spacing:-2px;text-shadow:0 2px 18px #0006}
.tag{align-self:flex-start;color:#ffe1d3;background:#ffffff1c;border:1px solid #ffffff35;margin-bottom:20px}
dt{color:#eac2af;font-size:12px;margin-top:22px}dd{font-size:clamp(17px,1.6vw,22px);color:#fff}
a{color:#fff;text-decoration:underline;text-underline-offset:5px}.close{position:fixed;right:30px;top:30px;width:48px;height:48px;font-size:30px;z-index:5;color:#fff;background:#162635aa;border:1px solid #ffffff55;backdrop-filter:blur(10px)}
@media(max-width:640px){.grid{grid-template-columns:1fr;gap:18px}.card{min-height:510px}.photo{height:100%}.info{padding:28px}.info h2{font-size:36px}.profile-copy{padding:90px 26px 40px;max-width:100%;justify-content:flex-end;min-height:100%}dialog h2{font-size:42px}dialog::after{background:linear-gradient(180deg,#101c2b05 0%,#101c2b77 30%,#101c2bf0 58%)}.avatar img{object-position:center top}.close{right:24px;top:24px}dd{font-size:18px}}

/* Show the entire original portrait in the opened profile. */
dialog[open]{display:grid;grid-template-columns:minmax(0,3fr) minmax(280px,2fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
dialog::after{display:none}
dialog .avatar{position:relative;inset:auto;z-index:auto;width:100%;height:100%;min-height:0;overflow:hidden;background:#15232d;align-self:stretch}
dialog .avatar img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;transform:none}
dialog .avatar .initials{justify-self:center;margin:0;font-size:clamp(80px,16vw,220px)}
dialog .profile-copy{min-height:0;height:100%;max-width:none;padding:72px clamp(24px,3vw,48px) 40px;overflow-y:auto;display:block;background:linear-gradient(145deg,#263b49,#14222d)}
dialog h2{font-size:clamp(30px,3.5vw,56px);overflow-wrap:anywhere}
@media(max-width:700px){dialog[open]{grid-template-columns:minmax(0,1fr);grid-template-rows:55vh auto;overflow-y:auto}dialog .avatar{height:55vh;min-height:0}dialog .profile-copy{height:auto;overflow:visible;padding:30px 24px 40px}dialog h2{font-size:36px}}
</style></head><body><main class="grid" id="cards" aria-label="Project authors"></main>
<dialog id="details" aria-labelledby="author-name"><button class="close" aria-label="Close author details">&times;</button><div class="avatar" id="avatar"></div><div class="profile-copy"><h2 id="author-name"></h2><p class="tag">Project author</p><dl><dt>Roll number</dt><dd id="roll"></dd><dt>Department</dt><dd>Department of Earth Sciences</dd><dt>Institution</dt><dd>IIT Bombay</dd><div id="email-block"><dt>Email</dt><dd><a id="email"></a></dd></div></dl></div></dialog>
<script>
const authors=__AUTHORS_JSON__;
const grid=document.getElementById('cards'), dialog=document.getElementById('details');
function portrait(a){const el=document.createElement(a.photo?'img':'span');if(a.photo){el.src=a.photo;el.alt=a.name;}else{el.className='initials';el.textContent=a.initials;el.setAttribute('aria-label','Photo not yet supplied');}return el;}
authors.forEach(a=>{
 const card=document.createElement('button');card.className='card';card.type='button';card.setAttribute('aria-haspopup','dialog');card.setAttribute('aria-label','View details for '+a.name);
 const photo=document.createElement('div');photo.className='photo';photo.append(portrait(a));
 const badge=document.createElement('span');badge.className='badge';badge.textContent='MEET THE AUTHOR';photo.append(badge);
 const info=document.createElement('div');info.className='info';const name=document.createElement('h2');name.textContent=a.name;const dept=document.createElement('p');dept.textContent='Department of Earth Sciences';
 const action=document.createElement('div');action.className='action';action.innerHTML='<span>View profile</span><span class="arrow" aria-hidden="true">↗</span>';
 info.append(name,dept,action);card.append(photo,info);grid.append(card);
 card.addEventListener('click',()=>{document.getElementById('avatar').replaceChildren(portrait(a));document.getElementById('author-name').textContent=a.name;document.getElementById('roll').textContent=a.roll;document.getElementById('email-block').hidden=!a.email;const email=document.getElementById('email');email.textContent=a.email||'';email.href=a.email?'mailto:'+a.email:'';dialog.showModal();});
});
document.querySelector('.close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{const r=dialog.getBoundingClientRect();if(e.target===dialog&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))dialog.close();});
</script></body></html>
